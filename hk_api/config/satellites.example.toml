# 위성별 DB 접속 정보 템플릿.
#
# 사용법:
#   1) 이 파일을 config/satellites.toml 로 복사
#   2) 아래 값들을 실제 DB 접속 정보로 채우기
#   3) config/satellites.toml 은 .gitignore에 등록되어 있으므로 절대 커밋하지 말 것
#
# O1A/O1B는 실제로는 같은 MySQL DB(nstanl)를 공유하고 hk1~hk6 테이블 이름만
# 접두어(tbl_obs1a_hk*/tbl_obs1b_hk*)로 구분됩니다(core/loader/schema_map.py
# SATELLITE_TABLE_PREFIX 참고). 이 파일에서 위성마다 섹션을 나누는 이유는 접속
# 정보 자체가 다를 수 있는 위성(예: 별도 호스트를 쓰는 E3T 등)까지 등록 가능하게
# 하기 위함이며, DB 인스턴스가 항상 위성별로 분리된다는 의미는 아닙니다.
# satellite_id는 API 요청의 "satellite_id" 필드와 동일한 값을 사용해야 합니다.
#
# core/loader/hk_loader.py: HKLoader.for_satellite(satellite_id)
# config.py: SatelliteRegistry.get(satellite_id)
# 가 이 파일을 읽어 [satellite_id] 섹션을 찾습니다.

[O1A]
db_host = "127.0.0.1"
db_port = 3306
db_user = "nstanl"
db_password = "change_me"
db_name = "nstanl"

[O1B]
db_host = "127.0.0.1"
db_port = 3306
db_user = "nstanl"
db_password = "change_me"
db_name = "nstanl"

# 추가 위성은 아래 형식으로 섹션을 늘려서 등록
# [E3T]
# db_host = "..."
# db_port = 3306
# db_user = "..."
# db_password = "..."
# db_name = "..."
