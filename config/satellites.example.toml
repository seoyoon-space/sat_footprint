# 위성별 DB 접속 정보 템플릿.
#
# 사용법:
#   1) 이 파일을 config/satellites.toml 로 복사
#   2) 아래 값들을 실제 DB 접속 정보로 채우기
#   3) config/satellites.toml 은 .gitignore에 등록되어 있으므로 절대 커밋하지 말 것
#
# 위성마다 DB 인스턴스 자체가 분리되어 있는 구조를 그대로 반영합니다
# (예: O1A/O1B는 서로 다른 MySQL 호스트/DB일 수 있음).
# satellite_id는 API 요청의 "satellite_id" 필드와 동일한 값을 사용해야 합니다.
#
# core/loader/hk_loader.py: HKLoader.for_satellite(satellite_id)
# config.py: SatelliteRegistry.get(satellite_id)
# 가 이 파일을 읽어 [satellite_id] 섹션을 찾습니다.

